[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-nodegraph"
version = "0.1.0"
description = "Node Graph interface for FreeCAD"
authors = [
    { name = "FreeCAD NodeGraph Contributor" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PySide6>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-bdd>=7.0.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-bdd>=7.0.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
